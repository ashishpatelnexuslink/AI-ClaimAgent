name: claim_ai
description: "ClaimAI - AI-powered Claim Management System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6

  # Networking
  dio: ^5.7.0
  http: ^1.2.0
  http_parser: ^4.0.2
  connectivity_plus: ^6.1.0

  # Local Storage / Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Dependency Injection
  get_it: ^8.0.2

  # Functional Programming (Either type)
  dartz: ^0.10.1

  # JSON Serialization
  json_annotation: ^4.9.0

  # Equatable (value equality for entities)
  equatable: ^2.0.7

  # Image / File Handling
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.3.1

  # Share sheet (used on iOS to share/save downloaded documents)
  share_plus: ^10.1.4

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Logging
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0

  # Date Formatting
  intl: ^0.19.0

  # UUID
  uuid: ^4.5.1

  # Google Fonts
  google_fonts: ^6.2.1

  # SVG rendering
  flutter_svg: ^2.0.10+1

  # Speech Recognition
  speech_to_text: ^7.0.0

  # Text-to-Speech (avatar speaks AI replies in voice mode)
  flutter_tts: ^4.2.0

  # Shimmer loading
  shimmer: ^3.0.0

  # Cached Network Image
  cached_network_image: ^3.4.1

  # Markdown rendering (for chat bot responses)
  flutter_markdown: ^0.7.6

  # Flutter Secure Storage (for tokens)
  flutter_secure_storage: ^9.2.3
  local_auth: ^3.0.1

  # International phone number input (country picker + dial code + validation)
  intl_phone_number_input: ^0.7.4

  # Country picker (searchable bottom-sheet with flag + name)
  country_picker: ^2.0.27

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

  # Launcher icon generator
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
